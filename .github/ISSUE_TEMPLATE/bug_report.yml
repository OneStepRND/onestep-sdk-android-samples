name: Bug report
description: A sample app does not build, crashes, or does not behave as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **This repository is public.** Do not paste client tokens, API keys, identity-verification
        values, patient ids, or any patient data (names, measurements, health information) into this
        issue, its logs or its screenshots. Redact them first.

        For SDK access, credentials or account questions, email `shahar@onestep.co` instead.
  - type: dropdown
    id: sample
    attributes:
      label: Sample
      options:
        - QuickstartSample
        - ActiveMesurementSample
        - BackgroundMonitoringSample
        - UiKitSample
        - Repository / docs
    validations:
      required: true
  - type: input
    id: sdk-version
    attributes:
      label: OneStep SDK version
      placeholder: "2.3.0"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: "Pixel 8, Android 15"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (redacted)
      description: Remove tokens, keys and patient data before pasting.
      render: shell
  - type: checkboxes
    id: no-secrets
    attributes:
      label: Confirmation
      options:
        - label: This issue contains no credentials and no patient data.
          required: true
