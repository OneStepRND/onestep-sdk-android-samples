name: Secret scan

# Fails a pull request or push that adds a credential. Scans only the new commits, so it judges
# each change on its own. It fails closed: a commit range it cannot resolve is an error, not a pass.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Resolve the commit range
        env:
          EVENT_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          base="$EVENT_BASE"
          # A new branch has an all-zero "before"; a force-push leaves "before" unreachable.
          # In both cases fall back to where HEAD meets main.
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base=$(git merge-base origin/main "$HEAD" || true)
          fi
          if [ -z "$base" ]; then
            echo "::error::Cannot resolve a base commit for $HEAD."
            exit 1
          fi
          count=$(git rev-list --count "$base..$HEAD")
          if [ "$count" -eq 0 ]; then
            echo "::error::The range $base..$HEAD is empty; refusing to report a pass."
            exit 1
          fi
          echo "Scanning $count commit(s): $base..$HEAD"
          echo "BASE=$base" >> "$GITHUB_ENV"
          echo "HEAD=$HEAD" >> "$GITHUB_ENV"

      - name: Load the rules from the base commit
        # A change must not be able to relax the rules that judge it.
        run: |
          if ! git show "$BASE:.gitleaks.toml" > "$RUNNER_TEMP/gitleaks.toml" 2>/dev/null; then
            echo "The base commit has no .gitleaks.toml (first introduction); using this change's file."
            cp .gitleaks.toml "$RUNNER_TEMP/gitleaks.toml"
          fi

      - name: Scan the new commits
        # --diff-merges=first-parent walks every commit in the range, including those on merged
        # side branches, and also shows the changes each merge commit introduces.
        run: |
          gitleaks git --redact --no-banner --config "$RUNNER_TEMP/gitleaks.toml" \
            --log-opts="--diff-merges=first-parent $BASE..$HEAD" .
