# Secret scanning for this public repo. Used by .github/workflows/secret-scan.yml and the optional
# pre-commit hook in .githooks/. Credentials belong only in each sample's gitignored
# local.properties; see local.properties.example.
title = "OneStep sample apps"

[extend]
useDefault = true

# A OneStep credential written as a string literal in code, instead of read from BuildConfig.
# Covers camelCase and SNAKE_CASE names and an optional ": String" type. Placeholders that start
# with "<" (as in the READMEs) are allowed. A literal customerPatientId is flagged on purpose: a
# patient id is personal data, so samples use synthetic ids from local.properties only.
[[rules]]
id = "onestep-credential-literal"
description = "OneStep credential hardcoded as a string literal"
regex = '''(?i)\b(api_?key|client_?token|identity_?verification|customer_?patient_?id)(?:\s*:\s*String\??)?\s*[=:]\s*"([^"<$\s][^"]{7,})"'''
secretGroup = 2
keywords = [
  "apikey", "api_key", "clienttoken", "client_token",
  "identityverification", "identity_verification", "customerpatientid", "customer_patient_id",
]

# Documentation placeholders such as "your-client-token" or "api_key_789" are not credentials.
[[rules.allowlists]]
regexTarget = "secret"
regexes = [
  '''(?i)^(your|example|sample|placeholder|dummy|fake)[-_]''',
  '''(?i)^api_key_\d{1,4}$''',
  '''(?i)^server_generated_hmac$''',
]

# A credential baked into the build with buildConfigField instead of read from local.properties.
[[rules]]
id = "onestep-credential-buildconfig"
description = "OneStep credential hardcoded in a buildConfigField"
regex = '''buildConfigField\(\s*"String"\s*,\s*"(CLIENT_TOKEN|API_KEY|IDENTITY_VERIFICATION|CUSTOMER_PATIENT_ID)"\s*,\s*"\\"([^"\\$<][^"\\]{7,})\\""'''
secretGroup = 2
keywords = ["buildconfigfield"]

# A real value in a properties file (for example, local.properties copied under another name).
[[rules]]
id = "onestep-credential-property"
description = "OneStep credential value in a properties file"
regex = '''(?i)\bonestep\.(clientToken|identityVerification|customerPatientId)\s*=\s*([^<\s#][^\s#]{7,})'''
secretGroup = 2
keywords = ["onestep."]
